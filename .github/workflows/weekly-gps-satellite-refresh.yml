name: Weekly GPS satellite cache refresh

on:
  schedule:
    # Monday 03:00 IST (Sunday 21:30 UTC) — primary weekly run
    - cron: '30 21 * * 0'
    # Tuesday & Wednesday 03:00 IST — continue large farms (no-op if already done)
    - cron: '30 21 * * 1,2'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh all trees (not just missing this week)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_runtime_minutes:
        description: 'Max runtime in minutes (GitHub limit 360)'
        required: false
        default: '330'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run weekly satellite batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GPS_SATELLITE_CRON_SECRET: ${{ secrets.GPS_SATELLITE_CRON_SECRET }}
          FARM_ID: ${{ secrets.FARM_ID }}
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes || '330' }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: node scripts/run-gps-satellite-batch.mjs
